[package]
name = "fl_rust"
version = "0.19.1"
edition = "2024"

[lib]
name = "fl_rust"
path = "src/lib.rs"

[[bin]]
name = "fl"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
dirs = "6.0.0"
futures-util = "0.3.34"
libc = "0.2.189"
notify = "8.2.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
url = "2.5.8"
